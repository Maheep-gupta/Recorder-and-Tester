<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Replayr">
  <defs>
    <linearGradient id="rp-g" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7665EF"/>
      <stop offset="1" stop-color="#3FB6D3"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#rp-g)"/>
  <!-- replay loop: ~290 degrees, open at the top-right -->
  <path d="M20.5 8.2 A9 9 0 1 0 25 17.6" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
  <!-- cursor-shaped arrowhead closing the loop: the browser interaction being replayed -->
  <path d="M25.6 10.4 L28.4 18.6 L25.3 17.2 L22.6 19.4 Z" fill="#fff"/>
  <!-- the recording dot -->
  <circle cx="16" cy="16" r="3.4" fill="#fff"/>
</svg>
