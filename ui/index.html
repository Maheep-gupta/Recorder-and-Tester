<head>
<meta charset="utf-8">

<title>Design Studio Tester</title>
<!--
  Design Studio Tester — the recorder UI. DEV ONLY, served by src/server.js on 127.0.0.1.
  Plain HTML/CSS/JS. No build step, no framework, NO external requests (the machine may be offline).
  The server re-reads this file per request, so a browser reload is all an edit needs.

  Layout : sidebar + topbar + page. Below 900px the sidebar becomes a drawer (.shell.nav-open);
           on laptops it can collapse to icons (.shell.rail, remembered in localStorage).
  Routes : #/home #/tests #/record #/test/:id #/executions #/settings #/run/:testId/:runId
  Data   : /api/* on the same origin, live updates over /api/events (SSE).
-->
<link rel="stylesheet" href="/ui/app.css">
</head>
<body>

<div class="scrim" id="scrim" aria-hidden="true"></div>

<div class="shell">
  <!-- ═════════════ SIDEBAR ═════════════ -->
  <aside class="sidebar" id="sidebar">
    <div class="wordmark">
      <span class="glyph"><svg class="i i-sm"><use href="#i-zap"/></svg></span>
      <span class="name hide-collapsed">Design Studio Tester</span>
      <span class="grow hide-collapsed"></span>
      <span class="u-desktop-only"><button class="btn-icon" id="railBtn" data-act="collapse-sidebar"
              title="Collapse sidebar" aria-label="Collapse sidebar" aria-pressed="false">
        <svg class="i i-sm" aria-hidden="true"><use href="#i-sidebar"/></svg>
      </button></span>
      <span class="u-mobile-only"><button class="btn-icon" id="drawerClose" data-act="close-drawer"
              title="Close navigation" aria-label="Close navigation">
        <svg class="i i-sm" aria-hidden="true"><use href="#i-x"/></svg>
      </button></span>
    </div>
    <nav class="nav" id="nav" aria-label="Main"></nav>
    <div class="sb-card hide-collapsed" id="sbCard"></div>
    <div class="sb-user" id="sbUser"></div>
  </aside>

  <!-- ═════════════ CONTENT ═════════════ -->
  <div class="content">
    <div class="topbar">
      <button class="btn-icon hamburger" id="burger" data-act="open-drawer" aria-label="Open navigation"
              aria-expanded="false" aria-controls="sidebar"><svg class="i" aria-hidden="true"><use href="#i-menu"/></svg></button>
      <label class="topsearch" for="globalSearch">
        <svg class="i i-sm"><use href="#i-search"/></svg>
        <input id="globalSearch" type="search" placeholder="Search tests, folders…" autocomplete="off" aria-label="Search tests">
        <kbd>/</kbd>
      </label>
      <span class="grow"></span>
      <span class="pill" id="connPill" title="This tool talks only to your machine"><span class="dot"></span>Local Only</span>
      <button class="btn-icon" id="themeBtn" data-act="theme-menu" aria-haspopup="menu" aria-label="Theme"><svg class="i" aria-hidden="true"><use href="#i-moon" id="themeIcon"/></svg></button>
      <span class="avatar" id="topAvatar" title="Local user">··</span>
    </div>
    <main class="page" id="page" tabindex="-1"><div class="empty-sm">Loading Design Studio Tester…</div></main>
  </div>
</div>

<div class="toasts" id="toasts"></div>
<div id="overlayHost"></div>

<!-- Polite announcements: run progress, recording state. Visually hidden (.sr-only). -->
<div id="liveRegion" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

<script src="/ui/app.js" defer></script>
</body>
</html>
